<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>parana.si — Domínio à venda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white: #ffffff;
      --off: rgba(255,255,255,0.55);
      --dim: rgba(255,255,255,0.2);
      --line: rgba(255,255,255,0.08);
    }

    html, body {
      height: 100%;
      width: 100%;
      background: #080808;
      color: var(--white);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── Noise texture overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.022;
      pointer-events: none;
      z-index: 100;
    }

    /* ── Subtle radial glow ── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 70% 60% at 50% 45%, rgba(255,255,255,0.03) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Layout ── */
    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: clamp(32px, 5vw, 64px);
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo img {
      height: 28px;
      width: auto;
      filter: brightness(0) invert(1);
      opacity: 0.9;
    }

    .logo-wordmark {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.85);
      text-transform: lowercase;
    }

    .topbar-right {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--dim);
    }

    /* ── Hero ── */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 0;
    }

    .eyebrow {
      font-size: clamp(11px, 1.4vw, 13px);
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #FFD600;
      margin-bottom: 28px;
    }

    .domain {
      font-size: clamp(5rem, 15vw, 11rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 0.92;
      color: var(--white);
      margin-bottom: 52px;
      /* subtle text shimmer */
      background: linear-gradient(160deg, #fff 55%, rgba(255,255,255,0.5) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* thin separator */
    .sep {
      width: 1px;
      height: 48px;
      background: linear-gradient(180deg, transparent, rgba(255,255,255,0.18), transparent);
      margin-bottom: 40px;
    }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 10px;
    }

    .price-label {
      font-size: clamp(12px, 1.5vw, 14px);
      font-weight: 400;
      letter-spacing: 0.06em;
      color: var(--off);
    }

    .price-value {
      font-size: clamp(2rem, 5.5vw, 3.75rem);
      font-weight: 300;
      letter-spacing: -0.02em;
      color: var(--white);
      font-variant-numeric: tabular-nums;
    }

    .price-sub {
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 52px;
    }

    /* ── CTA ── */
    .cta-line {
      font-size: clamp(12px, 1.4vw, 13px);
      font-weight: 400;
      letter-spacing: 0.08em;
      color: var(--off);
      margin-bottom: 16px;
    }

    .cta-email {
      display: inline-block;
      font-size: clamp(14px, 1.8vw, 17px);
      font-weight: 500;
      letter-spacing: 0.01em;
      color: var(--white);
      text-decoration: none;
      padding: 14px 32px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 100px;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    .cta-email:hover {
      background: rgba(255,255,255,0.09);
      border-color: rgba(255,255,255,0.3);
    }

    /* ── Footer ── */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-left {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--dim);
    }

    .footer-right {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.08em;
      color: var(--dim);
    }

    /* horizontal rule */
    .footer-rule {
      width: 100%;
      height: 1px;
      background: var(--line);
      margin-bottom: 20px;
    }

    .footer-wrap {
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 600px) {
      html, body { overflow: auto; }
      .page { height: auto; min-height: 100vh; padding: 28px 24px; }
      .topbar-right { display: none; }
      .domain { margin-bottom: 36px; }
    }

    /* ── Chat ── */
    .chat { position: fixed; right: clamp(16px, 3vw, 32px); bottom: clamp(16px, 3vw, 32px); z-index: 50; width: min(340px, calc(100vw - 32px));
      background: #121212; border: 1px solid var(--line); border-radius: 18px; padding: 18px; box-shadow: 0 20px 40px rgba(0,0,0,.6);
      transform: translateY(16px); opacity: 0; pointer-events: none; transition: opacity .35s ease, transform .35s ease; }
    .chat.on { transform: none; opacity: 1; pointer-events: auto; }
    .chat-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .chat-q { font-size: 15px; font-weight: 600; line-height: 1.4; }
    .chat-x { background: none; border: 0; color: var(--off); font-size: 20px; line-height: 1; cursor: pointer; padding: 0 2px; }
    .chat-opts { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
    .chat button.opt, .chat button.send { font: inherit; font-size: 14px; font-weight: 600; color: #080808; background: #fff; border: 0; border-radius: 999px; padding: 11px 16px; cursor: pointer; }
    .chat button.opt.alt { background: transparent; color: var(--white); border: 1px solid var(--dim); }
    .chat form { display: none; margin-top: 14px; gap: 8px; flex-direction: column; }
    .chat form.on { display: flex; }
    .chat input, .chat textarea { font: inherit; font-size: 14px; color: var(--white); background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; resize: none; }
    .chat input:focus, .chat textarea:focus { outline: 1px solid var(--off); }
    .chat .hp { position: absolute; left: -9999px; }
    .chat-ok { display: none; margin-top: 12px; font-size: 14px; color: var(--off); line-height: 1.5; }
    .chat-ok.on { display: block; }
    .chat-note { margin-top: 10px; font-size: 11px; color: var(--dim); }
  </style>
</head>
<body>
  <div class="page">

    <!-- Hero -->
    <main class="hero">
      <p class="eyebrow">Domínio à venda</p>
      <h1 class="domain">parana.si</h1>
      <div class="sep"></div>

      <div class="price-row">
        <span class="price-label">Por</span>
        <span class="price-value" id="price">—</span>
      </div>

      <p class="cta-line">Expresse seu interesse</p>
      <a class="cta-email" href="mailto:neimaciel@random.marketing?subject=Interesse%20no%20dom%C3%ADnio%20parana.si">
        neimaciel@random.marketing
      </a>
    </main>



  </div>

  <script>
    const BASE   = 32650.00;
    const LAUNCH = new Date('2026-10-02T00:00:00-03:00');
    const RATE   = 0.01;

    function todayBRT() {
      const now = new Date();
      const s = now.toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' });
      return new Date(s + 'T00:00:00-03:00');
    }

    function daysBetween(a, b) {
      return Math.max(0, Math.round((b - a) / 86400000));
    }

    function formatPrice(v) {
      return 'US$ ' + v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function update() {
      const days = daysBetween(LAUNCH, todayBRT());
      const val  = BASE * Math.pow(1 + RATE, days);
      document.getElementById('price').textContent = formatPrice(val);
    }

    update();

    // refresh at midnight BRT
    function msToMidnightBRT() {
      const now = new Date();
      const brt = new Date(now.toLocaleString('en-US', { timeZone: 'America/Sao_Paulo' }));
      const next = new Date(brt);
      next.setDate(next.getDate() + 1);
      next.setHours(0, 0, 0, 0);
      return next - brt;
    }
    setTimeout(function tick() { update(); setTimeout(tick, msToMidnightBRT()); }, msToMidnightBRT());

    // ── Rastreador interno silencioso ──
    (function() {
      try {
        var payload = JSON.stringify({
          path: window.location.pathname + window.location.search,
          ref: document.referrer || '',
          screen: window.screen ? (window.screen.width + 'x' + window.screen.height) : ''
        });
        if (navigator.sendBeacon) {
          navigator.sendBeacon('/track.php', new Blob([payload], {type: 'application/json'}));
        } else {
          fetch('/track.php', {
            method: 'POST',
            body: payload,
            headers: {'Content-Type': 'application/json'},
            keepalive: true
          }).catch(function(){});
        }
      } catch(e) {}
    })();
  </script>
  <noscript><img src="/track.php?type=img" width="1" height="1" style="display:none" alt="" /></noscript>
  <aside class="chat" id="chat" role="dialog" aria-live="polite" aria-label="Chat do domínio">
    <div class="chat-top">
      <div class="chat-q" id="chat-q">Esse domínio te interessa?</div>
      <button class="chat-x" id="chat-x" type="button" aria-label="Fechar">&times;</button>
    </div>
    <div class="chat-opts" id="chat-opts">
      <button class="opt" type="button" data-i="sim">Sim, quero saber mais</button>
      <button class="opt alt" type="button" data-i="olhando">Só estou olhando</button>
    </div>
    <form id="chat-form" autocomplete="off">
      <input class="hp" name="site" tabindex="-1" aria-hidden="true" />
      <input name="contato" id="chat-contato" type="text" maxlength="120" placeholder="Seu e-mail ou WhatsApp" />
      <textarea name="mensagem" id="chat-msg" rows="3" maxlength="800" placeholder="Quer deixar uma mensagem? (opcional)"></textarea>
      <button class="send" type="submit">Enviar</button>
    </form>
    <div class="chat-ok" id="chat-ok"></div>
    <div class="chat-note">Sem cookies. Só guardamos o que você escrever aqui.</div>
  </aside>
  <script>
    (function () {
      var box = document.getElementById('chat');
      if (!box) return;
      try { if (sessionStorage.getItem('chat_fechado')) return; } catch (e) {}
      var escolha = '';
      var q = document.getElementById('chat-q');
      var opts = document.getElementById('chat-opts');
      var form = document.getElementById('chat-form');
      var ok = document.getElementById('chat-ok');
      var visivel = 0;
      var tick = setInterval(function () {
        if (document.visibilityState === 'visible') visivel += 1;
        if (visivel >= 10) { clearInterval(tick); box.classList.add('on'); }
      }, 1000);
      function fechar() {
        box.classList.remove('on');
        try { sessionStorage.setItem('chat_fechado', '1'); } catch (e) {}
      }
      document.getElementById('chat-x').addEventListener('click', fechar);
      opts.addEventListener('click', function (ev) {
        var b = ev.target.closest('button[data-i]');
        if (!b) return;
        escolha = b.getAttribute('data-i');
        opts.style.display = 'none';
        q.textContent = escolha === 'sim' ? 'Ótimo. Como posso falar com você?' : 'Sem problema. Quer deixar um recado?';
        form.classList.add('on');
        (escolha === 'sim' ? document.getElementById('chat-contato') : document.getElementById('chat-msg')).focus();
      });
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var d = new FormData(form);
        var corpo = JSON.stringify({ interesse: escolha, contato: d.get('contato') || '', mensagem: d.get('mensagem') || '', site: d.get('site') || '' });
        form.classList.remove('on');
        ok.textContent = 'Enviando...';
        ok.classList.add('on');
        fetch('/chat.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: corpo })
          .then(function (r) { return r.json(); })
          .then(function (j) {
            ok.textContent = j.ok ? 'Recebido. Obrigado, retorno em breve.' : 'Não consegui enviar agora. Escreva para neimaciel@random.marketing.';
            if (j.ok) setTimeout(fechar, 4000);
          })
          .catch(function () { ok.textContent = 'Não consegui enviar agora. Escreva para neimaciel@random.marketing.'; });
      });
    })();
  </script>
</body>
</html>
