<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>parana.si — Domínio à venda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white: #ffffff;
      --off: rgba(255,255,255,0.55);
      --dim: rgba(255,255,255,0.2);
      --line: rgba(255,255,255,0.08);
    }

    html, body {
      height: 100%;
      width: 100%;
      background: #080808;
      color: var(--white);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── Noise texture overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.022;
      pointer-events: none;
      z-index: 100;
    }

    /* ── Subtle radial glow ── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 70% 60% at 50% 45%, rgba(255,255,255,0.03) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Layout ── */
    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: clamp(32px, 5vw, 64px);
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo img {
      height: 28px;
      width: auto;
      filter: brightness(0) invert(1);
      opacity: 0.9;
    }

    .logo-wordmark {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.85);
      text-transform: lowercase;
    }

    .topbar-right {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--dim);
    }

    /* ── Hero ── */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 0;
    }

    .eyebrow {
      font-size: clamp(11px, 1.4vw, 13px);
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #FFD600;
      margin-bottom: 28px;
    }

    .domain {
      font-size: clamp(5rem, 15vw, 11rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 0.92;
      color: var(--white);
      margin-bottom: 52px;
      /* subtle text shimmer */
      background: linear-gradient(160deg, #fff 55%, rgba(255,255,255,0.5) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* thin separator */
    .sep {
      width: 1px;
      height: 48px;
      background: linear-gradient(180deg, transparent, rgba(255,255,255,0.18), transparent);
      margin-bottom: 40px;
    }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 10px;
    }

    .price-label {
      font-size: clamp(12px, 1.5vw, 14px);
      font-weight: 400;
      letter-spacing: 0.06em;
      color: var(--off);
    }

    .price-value {
      font-size: clamp(2rem, 5.5vw, 3.75rem);
      font-weight: 300;
      letter-spacing: -0.02em;
      color: var(--white);
      font-variant-numeric: tabular-nums;
    }

    .price-sub {
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 52px;
    }

    /* ── CTA ── */
    .cta-line {
      font-size: clamp(12px, 1.4vw, 13px);
      font-weight: 400;
      letter-spacing: 0.08em;
      color: var(--off);
      margin-bottom: 16px;
    }

    .cta-email {
      display: inline-block;
      font-size: clamp(14px, 1.8vw, 17px);
      font-weight: 500;
      letter-spacing: 0.01em;
      color: var(--white);
      text-decoration: none;
      padding: 14px 32px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 100px;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    .cta-email:hover {
      background: rgba(255,255,255,0.09);
      border-color: rgba(255,255,255,0.3);
    }

    /* ── Footer ── */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-left {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--dim);
    }

    .footer-right {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.08em;
      color: var(--dim);
    }

    /* horizontal rule */
    .footer-rule {
      width: 100%;
      height: 1px;
      background: var(--line);
      margin-bottom: 20px;
    }

    .footer-wrap {
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 600px) {
      html, body { overflow: auto; }
      .page { height: auto; min-height: 100vh; padding: 28px 24px; }
      .topbar-right { display: none; }
      .domain { margin-bottom: 36px; }
    }
  </style>
</head>
<body>
  <div class="page">

    <!-- Hero -->
    <main class="hero">
      <p class="eyebrow">Domínio à venda</p>
      <h1 class="domain">parana.si</h1>
      <div class="sep"></div>

      <div class="price-row">
        <span class="price-label">Por</span>
        <span class="price-value" id="price">—</span>
      </div>

      <p class="cta-line">Expresse seu interesse</p>
      <a class="cta-email" href="mailto:neimaciel@random.marketing?subject=Interesse%20no%20dom%C3%ADnio%20parana.si">
        neimaciel@random.marketing
      </a>
    </main>



  </div>

  <script>
    const BASE   = 32650.00;
    const LAUNCH = new Date('2026-10-02T00:00:00-03:00');
    const RATE   = 0.01;

    function todayBRT() {
      const now = new Date();
      const s = now.toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' });
      return new Date(s + 'T00:00:00-03:00');
    }

    function daysBetween(a, b) {
      return Math.max(0, Math.round((b - a) / 86400000));
    }

    function formatPrice(v) {
      return 'US$ ' + v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function update() {
      const days = daysBetween(LAUNCH, todayBRT());
      const val  = BASE * Math.pow(1 + RATE, days);
      document.getElementById('price').textContent = formatPrice(val);
    }

    update();

    // refresh at midnight BRT
    function msToMidnightBRT() {
      const now = new Date();
      const brt = new Date(now.toLocaleString('en-US', { timeZone: 'America/Sao_Paulo' }));
      const next = new Date(brt);
      next.setDate(next.getDate() + 1);
      next.setHours(0, 0, 0, 0);
      return next - brt;
    }
    setTimeout(function tick() { update(); setTimeout(tick, msToMidnightBRT()); }, msToMidnightBRT());
  </script>
</body>
</html>
