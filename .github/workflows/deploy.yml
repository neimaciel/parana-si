name: Deploy via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar config.local.php a partir dos segredos
        env:
          ADMIN_HASH: ${{ secrets.PARANA_ADMIN_HASH }}
          SALT: ${{ secrets.PARANA_SALT }}
        run: |
          test -n "$ADMIN_HASH" && test -n "$SALT"
          printf "<?php\ndefine('ADMIN_PASSWORD_HASH', '%s');\ndefine('ANALYTICS_SALT', '%s');\n" "$ADMIN_HASH" "$SALT" > config.local.php

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/README.md
            **/data/**
            **/*.db*
            **/*.sqlite*
